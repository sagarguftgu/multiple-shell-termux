name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # 💡 इससे आप मोबाइल से खुद बटन दबाकर भी बिल्ड चालू कर सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Dependencies
      run: npm install

    - name: Build React App
      run: npm run build

    - name: Initialize Android Project
      run: |
        npx cap add android
        # जावा फ़ाइल को सही पैकेज डायरेक्टरी में कॉपी करना
        mkdir -p android/app/src/main/java/com/multishell/termuxapp/
        cp -r node_modules/@capacitor/android/android/app/src/main/java/com/multishell/termuxapp/* android/app/src/main/java/com/multishell/termuxapp/ 2>/dev/null || true
        npx cap sync
        
    - name: Build APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: multi-shell-termux-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
